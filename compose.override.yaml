x-image-labels: &image-labels
  org.opencontainers.image.source: https://github.com/LuganoPlanB/mailproof
  org.opencontainers.image.version: ${MAILPROOF_VERSION:-dev}

x-mailproof-build: &mailproof-build
  context: .
  dockerfile: containers/mailproof/Dockerfile
  args:
    MAILPROOF_VERSION: ${MAILPROOF_VERSION:-dev}
  labels: *image-labels

services:
  init:
    build:
      context: .
      dockerfile: containers/init/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        OPENSSL_VERSION: ${OPENSSL_VERSION:-3.5.6-1~deb13u2}
      labels: *image-labels

  postfix:
    build:
      context: .
      dockerfile: containers/postfix/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        POSTFIX_VERSION: ${POSTFIX_VERSION:-3.10.11-0+deb13u1}
        CA_CERTIFICATES_VERSION: ${CA_CERTIFICATES_VERSION:-20250419}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
      labels: *image-labels

  admission:
    build: *mailproof-build

  dovecot:
    build:
      context: .
      dockerfile: containers/dovecot/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DOVECOT_VERSION: ${DOVECOT_VERSION:-1:2.4.1+dfsg1-6+deb13u6}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
      labels: *image-labels

  collector:
    build: *mailproof-build

  worker:
    build: *mailproof-build

  reporter:
    build: *mailproof-build

  results-api:
    build: *mailproof-build

  analytics-projector:
    build: *mailproof-build

  intel-projector:
    build: *mailproof-build

  dashboard:
    build: *mailproof-build

  control-api:
    build: *mailproof-build

  smoke:
    build:
      context: .
      dockerfile: containers/smoke/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        NETCAT_OPENBSD_VERSION: ${NETCAT_OPENBSD_VERSION:-1.229-1}
        PYTHON3_VERSION: ${PYTHON3_VERSION:-3.13.5-1}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
      labels: *image-labels

  redis:
    build:
      context: .
      dockerfile: containers/analyzer/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        PACKAGES: redis-server=${REDIS_VERSION:-5:8.0.2-3+deb13u2}
      labels: *image-labels

  unbound:
    build:
      context: .
      dockerfile: containers/analyzer/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        PACKAGES: unbound=${UNBOUND_VERSION:-1.22.0-2+deb13u3} dns-root-data=${DNS_ROOT_DATA_VERSION:-2025080400~deb13u1}
      labels: *image-labels

  clamav:
    build:
      context: .
      dockerfile: containers/analyzer/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        PACKAGES: clamav-daemon=${CLAMAV_VERSION:-1.4.3+dfsg-1}
      labels: *image-labels

  clamav-db-init:
    build: &clamav-provisioner-build
      context: .
      dockerfile: containers/clamav-provisioner/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        CLAMAV_VERSION: ${CLAMAV_VERSION:-1.4.3+dfsg-1}
        CURL_VERSION: ${CURL_VERSION:-8.14.1-2+deb13u4}
        CA_CERTIFICATES_VERSION: ${CA_CERTIFICATES_VERSION:-20250419}
      labels: *image-labels

  clamav-updater:
    build: *clamav-provisioner-build

  olefy:
    build:
      context: .
      dockerfile: containers/olefy/Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_OLEFY_BASE:-python@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419}
      labels: *image-labels

  rspamd:
    build:
      context: .
      dockerfile: containers/analyzer/Dockerfile
      args:
        DEBIAN_BASE: ${DEBIAN_BASE:-debian@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258}
        DEBIAN_SNAPSHOT: ${DEBIAN_SNAPSHOT:-20260814T000000Z}
        PACKAGES: rspamd=${RSPAMD_VERSION:-3.12.1-1}
      labels: *image-labels
