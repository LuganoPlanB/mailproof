name: mailproof

# Docker Engine 27.0+ and Docker Compose v2.30+ are the tested minimums.
# Every base image and Debian package is pinned in config/versions.env.
x-logging: &logging
  driver: local
  options:
    max-size: "${MAILPROOF_LOG_MAX_SIZE:-10m}"
    max-file: "${MAILPROOF_LOG_MAX_FILE:-3}"
x-hardening: &hardening
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  pids_limit: 256
x-resources: &resources
  deploy:
    resources:
      limits: {cpus: "1.0", memory: 512M, pids: 256}
services:
  init:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-init"
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      MAILPROOF_REPORT_RECIPIENT: ${MAILPROOF_REPORT_RECIPIENT:-operator@example.org}
      MAILPROOF_VERIFY_RECIPIENT: ${MAILPROOF_VERIFY_RECIPIENT:-verify@mailproof.test}
      MAILPROOF_SUBJECT_SENDER_DOMAIN_ALLOWLIST: ${MAILPROOF_SUBJECT_SENDER_DOMAIN_ALLOWLIST:-}
      MAILPROOF_CLAMAV_PROVISION: ${MAILPROOF_CLAMAV_PROVISION:-none}
    volumes:
      - ./containers/init/entrypoint.sh:/entrypoint.sh:ro
      - runtime:/runtime
      - clamav-db:/clamav-db
      - artifacts:/artifacts
      - state:/state
      - reports:/reports
      - maildir:/var/mail/verification
      - postfix-log:/var/log/mailproof
    restart: "no"
    logging: *logging

  postfix:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-postfix"
    depends_on:
      init: {condition: service_completed_successfully}
      dovecot: {condition: service_healthy}
      admission: {condition: service_started}
    ports: ["${MAILPROOF_SMTP_PORT:-2525}:25"]
    networks: [public, mail, report]
    volumes:
      - ./config/postfix/main.cf:/etc/postfix/main.cf:ro
      - runtime:/runtime:ro
      - postfix-log:/var/log/mailproof
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/25"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  # The only SMTP-time application component. It is confined to the mail
  # network and has neither delivered mail nor analyzer/scanner access.
  admission:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["admission"]
    depends_on: {init: {condition: service_completed_successfully}}
    networks: [mail]
    volumes:
      - state:/state
      - runtime:/runtime:ro
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/mailproof.sqlite"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  dovecot:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-dovecot"
    depends_on: {init: {condition: service_completed_successfully}}
    networks: [mail]
    volumes:
      - ./config/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./config/dovecot/sieve-before:/etc/dovecot/sieve-before:ro
      - maildir:/var/mail/verification
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "doveadm service status lmtp >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  collector:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["collect", "--watch", "--postfix-log", "/postfix-log/ingress.log", "--token-registry", "/runtime/secrets/token-registry.json", "--admission-stamp-key", "/runtime/secrets/admission-stamp-hmac-key", "--subject-domain-allowlist", "/runtime/config/subject-sender-domain-allowlist"]
    depends_on: {dovecot: {condition: service_healthy}}
    networks: [mail]
    volumes:
      - maildir:/var/mail/verification:ro
      - artifacts:/artifacts
      - state:/state
      - postfix-log:/postfix-log:ro
      - runtime:/runtime:ro
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/mailproof.sqlite"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  worker:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["worker"]
    depends_on:
      collector: {condition: service_healthy}
      rspamd: {condition: service_healthy}
      unbound: {condition: service_healthy}
    networks: [analyzer]
    volumes:
      # Sealed messages and deliveries are immutable by convention; workers
      # publish only their own runs/<run-id>/analysis directory.
      - artifacts:/artifacts
      - state:/state
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *logging

  # Reporter is intentionally isolated from analyzer and public networks. Its
  # private key is available only through the read-only runtime volume.
  reporter:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["reporter"]
    depends_on:
      collector: {condition: service_healthy}
    networks: [report]
    volumes:
      - artifacts:/artifacts
      - state:/state
      - runtime:/runtime:ro
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *logging

  # Dashboard consumers join this internal-only network; no host port is
  # published and the API receives only a read-only state volume and token.
  results-api:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["results-api"]
    depends_on: {collector: {condition: service_healthy}}
    networks: [analytics]
    volumes:
      - state:/state:ro
      - artifacts:/artifacts:ro
      - runtime:/runtime:ro
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -r /state/mailproof.sqlite && test -r /runtime/secrets/results-api-token"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  # Projectors have no network path. They own only their bounded projection
  # writes; intel additionally reads immutable, signature-verified artifacts.
  analytics-projector:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["analytics-projector", "--watch"]
    depends_on:
      init: {condition: service_completed_successfully}
      results-api: {condition: service_healthy}
    network_mode: none
    volumes: [state:/state]
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *logging

  intel-projector:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["intel-projector", "--watch"]
    depends_on:
      init: {condition: service_completed_successfully}
      results-api: {condition: service_healthy}
    network_mode: none
    volumes:
      - state:/state
      - artifacts:/artifacts:ro
      - type: volume
        source: runtime
        target: /runtime/secrets/indicator-hmac-key
        read_only: true
        volume: {subpath: secrets/indicator-hmac-key}
      - type: volume
        source: runtime
        target: /runtime/secrets/report-verification-key.pem
        read_only: true
        volume: {subpath: secrets/report-verification-key.pem}
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *logging

  # The browser surface is explicitly opt-in and loopback-published by default.
  # Neither service joins the public, mail, analyzer, scanner, or report network.
  dashboard:
    profiles: [dashboard]
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["dashboard", "--host=0.0.0.0", "--port=3000", "--public-origin=${MAILPROOF_DASHBOARD_PUBLIC_ORIGIN:-http://localhost:3000}", "--results-url=http://results-api:8080", "--results-token-file=/runtime/secrets/results-api-token", "--control-url=http://control-api:8081", "--control-token-file=/runtime/secrets/control-api-token", "--session-key-file=/runtime/secrets/dashboard-session-hmac-key"]
    depends_on:
      results-api: {condition: service_healthy}
      control-api: {condition: service_healthy}
    ports: ["${MAILPROOF_DASHBOARD_HOST:-127.0.0.1}:${MAILPROOF_DASHBOARD_PORT:-3000}:3000"]
    environment:
      MAILPROOF_DASHBOARD_PUBLIC_ORIGIN: ${MAILPROOF_DASHBOARD_PUBLIC_ORIGIN:-http://localhost:3000}
    networks: [analytics, management]
    volumes:
      - type: volume
        source: runtime
        target: /runtime/secrets/results-api-token
        read_only: true
        volume: {subpath: secrets/results-api-token}
      - type: volume
        source: runtime
        target: /runtime/secrets/control-api-token
        read_only: true
        volume: {subpath: secrets/control-api-token}
      - type: volume
        source: runtime
        target: /runtime/secrets/dashboard-session-hmac-key
        read_only: true
        volume: {subpath: secrets/dashboard-session-hmac-key}
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -r /runtime/secrets/results-api-token && test -r /runtime/secrets/control-api-token && test -r /runtime/secrets/dashboard-session-hmac-key"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  control-api:
    profiles: [dashboard]
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-app"
    command: ["control-api", "--listen=:8081", "--state=/state/mailproof.sqlite", "--token-file=/runtime/secrets/control-api-token", "--confirmation-key-file=/runtime/secrets/control-confirmation-hmac-key", "--capability-key-file=/runtime/secrets/capability-hmac-key"]
    depends_on: {collector: {condition: service_healthy}}
    networks: [management]
    volumes:
      - state:/state
      - type: volume
        source: runtime
        target: /runtime/secrets/control-api-token
        read_only: true
        volume: {subpath: secrets/control-api-token}
      - type: volume
        source: runtime
        target: /runtime/secrets/control-confirmation-hmac-key
        read_only: true
        volume: {subpath: secrets/control-confirmation-hmac-key}
      - type: volume
        source: runtime
        target: /runtime/secrets/capability-hmac-key
        read_only: true
        volume: {subpath: secrets/capability-hmac-key}
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -r /state/mailproof.sqlite && test -r /runtime/secrets/control-api-token && test -r /runtime/secrets/control-confirmation-hmac-key && test -r /runtime/secrets/capability-hmac-key"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  smoke:
    profiles: [smoke]
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-smoke"
    depends_on:
      postfix: {condition: service_healthy}
      dovecot: {condition: service_healthy}
    environment:
      MAILPROOF_VERIFY_RECIPIENT: ${MAILPROOF_VERIFY_RECIPIENT:-verify@mailproof.test}
      MAILPROOF_SMOKE_MESSAGE_ID: ${MAILPROOF_SMOKE_MESSAGE_ID:-mailproof-smoke}
    networks: [public]
    volumes: [maildir:/var/mail/verification:ro]
    restart: "no"
    logging: *logging

  redis:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-redis"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment: {MAILPROOF_ANALYZER_ROLE: redis}
    networks: [analyzer]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12}
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    logging: *logging

  unbound:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-unbound"
    environment: {MAILPROOF_ANALYZER_ROLE: unbound}
    networks: [analyzer]
    # Debian's default config creates control/pid files, binds port 53, and
    # drops to the unbound package user during bootstrap.
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    healthcheck: {test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/53"], interval: 5s, timeout: 3s, retries: 12}
    <<: [*hardening, *resources]
    tmpfs: [/tmp, /run]
    logging: *logging

  clamav:
    depends_on:
      clamav-db-init: {condition: service_completed_successfully}
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-clamav"
    environment: {MAILPROOF_ANALYZER_ROLE: clamav}
    networks: [scanner]
    # clamd drops to its package user during startup; these are the minimal
    # capabilities required for that documented transition.
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - clamav-db:/var/lib/clamav:ro
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3310 && printf 'nPING\n' >&3 && IFS= read -r -t 4 -u 3 -N 4"]
      interval: 10s
      timeout: 5s
      retries: 12
    # ClamAV documents a 3 GiB minimum and 4 GiB preferred allocation for
    # loading current signature databases. The shared 512 MiB limit kills
    # clamd with SIGKILL (exit 137) before it can become healthy.
    deploy:
      resources:
        limits: {cpus: "1.0", memory: "${MAILPROOF_CLAMAV_MEMORY_LIMIT:-4G}", pids: 256}
    <<: *hardening
    tmpfs: [/tmp, /run, /var/run/clamav, /var/log/clamav]
    logging: *logging

  clamav-db-init:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-clamav-provisioner"
    environment:
      MAILPROOF_CLAMAV_PROVISION: ${MAILPROOF_CLAMAV_PROVISION:-none}
      MAILPROOF_CLAMAV_DATABASE: ${MAILPROOF_CLAMAV_DATABASE:-main}
      MAILPROOF_CLAMAV_DATABASE_URL: ${MAILPROOF_CLAMAV_DATABASE_URL:-}
      MAILPROOF_CLAMAV_DATABASE_SHA256: ${MAILPROOF_CLAMAV_DATABASE_SHA256:-}
      MAILPROOF_CLAMAV_DATABASE_VERSION: ${MAILPROOF_CLAMAV_DATABASE_VERSION:-}
    volumes: [clamav-db:/var/lib/clamav]
    restart: "no"
    logging: *logging

  clamav-updater:
    profiles: [clamav-updater]
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-clamav-provisioner"
    command: [update-loop]
    environment:
      MAILPROOF_CLAMAV_PROVISION: ${MAILPROOF_CLAMAV_PROVISION:-none}
      MAILPROOF_CLAMAV_UPDATE_INTERVAL_SECONDS: ${MAILPROOF_CLAMAV_UPDATE_INTERVAL_SECONDS:-21600}
    volumes: [clamav-db:/var/lib/clamav]
    restart: unless-stopped
    logging: *logging

  olefy:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-olefy"
    networks: [scanner]
    healthcheck: {test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",10050),2); s.close()'"], interval: 10s, timeout: 3s, retries: 12}
    <<: [*hardening, *resources]
    tmpfs: [/tmp]
    logging: *logging

  rspamd:
    image: "${MAILPROOF_IMAGE:-ghcr.io/luganoplanb/mailproof}:${MAILPROOF_VERSION:-dev}-rspamd"
    environment: {MAILPROOF_ANALYZER_ROLE: rspamd}
    depends_on:
      redis: {condition: service_healthy}
      clamav: {condition: service_healthy}
      olefy: {condition: service_healthy}
    networks: [analyzer, scanner]
    volumes:
      - ./config/rspamd/local.d:/etc/rspamd/local.d:ro
      - ./config/rspamd/plugins.d:/etc/rspamd/plugins.d:ro
    # rspamd initializes its runtime/log paths and then drops to _rspamd.
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck: {test: ["CMD-SHELL", "rspamadm configtest && rspamc -h 127.0.0.1:11334 stat >/dev/null"], interval: 10s, timeout: 5s, retries: 12}
    <<: [*hardening, *resources]
    tmpfs: [/tmp, /var/log/rspamd, /var/lib/rspamd]
    logging: *logging

networks:
  public: {}
  mail: {internal: true}
  analyzer: {internal: true}
  scanner: {internal: true}
  report: {internal: true}
  analytics: {internal: true}
  management: {internal: true}

volumes:
  runtime: {}
  maildir: {}
  artifacts: {}
  reports: {}
  state: {}
  postfix-log: {}
  clamav-db: {}
