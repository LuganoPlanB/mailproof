dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1
protocols = lmtp
listen = *
mail_driver = maildir
mail_path = /var/mail/verification
mailbox_list_layout = fs
first_valid_uid = 1000
first_valid_gid = 1000
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
protocol lmtp {
  postmaster_address = postmaster@mailproof.test
  mail_plugins = $mail_plugins sieve
}
mail_plugins = sieve
plugin {
  sieve = file:/var/mail/verification/sieve;active=/var/mail/verification/sieve/active.sieve
  sieve_before = /etc/dovecot/sieve-before
}
userdb static {
  allow_all_users = yes
  fields {
    uid = 1000
    gid = 1000
    home = /var/mail/verification
  }
}
passdb static {
  fields {
    password = nopassword
  }
}
