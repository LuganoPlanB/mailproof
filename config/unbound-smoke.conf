server:
    # Unbound's Debian default is loopback-only. Expose DNS solely inside the
    # internal Compose networks; no host port is published.
    interface: 0.0.0.0
    interface: ::0
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: fc00::/7 allow
    local-zone: "smoke.mailproof.test." static
    local-data: 'smoke.mailproof.test. 60 IN TXT "v=spf1 +all"'
