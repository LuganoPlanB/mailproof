name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      software: ${{ steps.changes.outputs.software }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Classify software changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -Eeuo pipefail
          base=${PUSH_BASE}
          if [[ ${EVENT_NAME} == pull_request ]]; then
            base=${PR_BASE}
          fi
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            software=$(scripts/release-eligible.sh "${base}" HEAD)
          else
            printf 'comparison base is unavailable; running the full quality suite\n' >&2
            software=true
          fi
          printf 'software=%s\n' "${software}" >>"${GITHUB_OUTPUT}"

  go-and-shell:
    needs: classify
    if: needs.classify.outputs.software == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.6'}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bats shellcheck shfmt
      - run: go mod verify
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: shellcheck --enable=all --shell=bash scripts/*.sh containers/*/entrypoint.sh
      - run: shfmt -d scripts containers
      - run: bats tests/shell
      - run: docker compose --env-file config/versions.env config --quiet
      - run: docker compose --env-file config/versions.env --profile smoke build --pull

  compose-smoke:
    needs: [classify, go-and-shell]
    if: needs.classify.outputs.software == 'true' && needs.go-and-shell.result == 'success'
    runs-on: ubuntu-24.04
    env:
      MAILPROOF_CLAMAV_PROVISION: latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and start the complete graph
        run: |
          docker compose --env-file config/versions.env --profile smoke --profile dashboard build --pull
          MAILPROOF_DASHBOARD_HOST=127.0.0.1 MAILPROOF_DASHBOARD_PORT=3000 MAILPROOF_DASHBOARD_PUBLIC_ORIGIN=http://127.0.0.1:3000 docker compose --env-file config/versions.env --profile dashboard up -d --wait
      - name: Validate Rspamd configuration and smoke delivery
        run: |
          docker compose exec -T rspamd rspamadm configtest
          results_api=$(docker compose ps -q results-api)
          test -n "${results_api}"
          test "$(docker inspect --format '{{.State.Health.Status}}' "${results_api}")" = healthy
          bash scripts/smoke.sh --confirm
      - name: Exercise collection and durable worker drain
        run: |
          docker compose stop collector
          docker compose run --rm --no-deps collector collect --once
          docker compose run --rm --no-deps worker worker --drain
      - name: Run deterministic browser smoke and management journeys
        run: |
          npm --prefix tests/browser ci
          npx --prefix tests/browser playwright install --with-deps chromium
          DASHBOARD_URL=http://127.0.0.1:3000 npm --prefix tests/browser test -- compose.spec.js
          npm --prefix tests/browser test -- dashboard.spec.js
      - name: Upload redacted browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-diagnostics
          path: |
            tests/browser/test-results
            tests/browser/playwright-report
          if-no-files-found: ignore
      - name: Collect diagnostics and stop services
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 || true
          docker compose down
