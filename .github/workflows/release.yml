name: release

on:
  workflow_run:
    workflows: [quality]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the qualified revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect an existing SemVer tag
        id: tags
        shell: bash
        run: |
          set -Eeuo pipefail
          tags=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*')
          if [[ -n ${tags} ]]; then
            printf '%s\n' 'exists=true' >>"${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'exists=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Bootstrap the first release
        if: steps.tags.outputs.exists == 'false'
        shell: bash
        run: printf '%s\n' 'RELEASE_VERSION=v0.1.0' >>"${GITHUB_ENV}"

      - name: Calculate the next release
        if: steps.tags.outputs.exists == 'true'
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: main
          patchAll: true

      - name: Select the calculated release
        if: steps.tags.outputs.exists == 'true'
        shell: bash
        env:
          NEXT_VERSION: ${{ steps.semver.outputs.next }}
        run: |
          set -Eeuo pipefail
          [[ ${NEXT_VERSION} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'RELEASE_VERSION=%s\n' "${NEXT_VERSION}" >>"${GITHUB_ENV}"

      - name: Stamp and validate the release Compose file
        id: compose
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ${RELEASE_VERSION} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          artifact="dist/mailproof-${RELEASE_VERSION}.compose.yaml"
          placeholder='$'
          placeholder+='{MAILPROOF_VERSION:-dev}'
          sed "s/${placeholder}/${RELEASE_VERSION}/g" compose.yaml >"${artifact}"
          if grep -Fq "${placeholder}" "${artifact}"; then
            printf '%s\n' 'release version placeholder was not fully stamped' >&2
            exit 1
          fi
          grep -Fq "MAILPROOF_VERSION: ${RELEASE_VERSION}" "${artifact}"
          docker compose --project-directory . --env-file config/versions.env -f "${artifact}" config --quiet
          sha256sum "${artifact}" >"${artifact}.sha256"
          printf 'artifact=%s\n' "${artifact}" >>"${GITHUB_OUTPUT}"

      - name: Verify the stamped application image
        shell: bash
        run: |
          set -Eeuo pipefail
          MAILPROOF_VERSION=${RELEASE_VERSION} docker compose --env-file config/versions.env build collector
          actual=$(MAILPROOF_VERSION=${RELEASE_VERSION} docker compose --env-file config/versions.env run --rm --no-deps collector version)
          python3 -c 'import json, sys; assert json.loads(sys.argv[1])["version"] == sys.argv[2]' "${actual}" "${RELEASE_VERSION}"
          label=$(docker image inspect mailproof-collector --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
          [[ ${label} == "${RELEASE_VERSION}" ]]

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT: ${{ steps.compose.outputs.artifact }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${QUALIFIED_SHA}" \
            --title "Mailproof ${RELEASE_VERSION}" \
            --generate-notes \
            "${ARTIFACT}#Version-stamped Docker Compose deployment" \
            "${ARTIFACT}.sha256#SHA-256 checksum"
