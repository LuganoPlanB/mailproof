<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font:16px sans-serif;fill:#111}.p{fill:#eef;stroke:#223}</style><rect width="1440" height="900" fill="white"/><text x="32" y="35">Campaign detail — UTC</text><rect class="p" x="32" y="60" width="1340" height="90"/><text x="48" y="95">1. Identity / status — opaque campaign ID, deterministic version</text><rect class="p" x="32" y="170" width="650" height="150"/><text x="48" y="205">2. Grouping reasons — safe indicators only</text><rect class="p" x="710" y="170" width="662" height="150"/><text x="726" y="205">3. Activity — line, UTC</text><rect class="p" x="32" y="340" width="650" height="160"/><text x="48" y="375">4. Safe indicators — table</text><rect class="p" x="710" y="340" width="662" height="160"/><text x="726" y="375">5. Distributions — horizontal bars</text><rect class="p" x="32" y="520" width="1340" height="260"/><text x="48" y="555">6. Members — paginated table → investigation result</text></svg>
